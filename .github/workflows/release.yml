name: macOS Beta Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

jobs:
  build:
    name: Build macOS beta (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    env:
      TAURI_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Build app bundle
        run: bunx tauri build --bundles app --target "${{ matrix.target }}"

      - name: Package DMG
        run: bun run package:macos-dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish draft prerelease
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'NOTES'
          macOS public beta build.

          Supported conversation sources: Codex, Claude Code, Antigravity, and Gemini CLI.

          Search includes visible messages, tool calls, terminal output, diffs, file previews, and errors.

          Diagnostics are manual only; issue reports do not include conversation contents by default.
          NOTES

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.dmg --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.dmg \
              --title "AI Conversations Explorer $RELEASE_TAG" \
              --notes-file release-notes.md \
              --draft \
              --prerelease
          fi
