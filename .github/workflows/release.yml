name: macOS Beta Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

jobs:
  build:
    name: Build macOS beta (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    env:
      TAURI_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Build app bundle
        run: bunx tauri build --bundles app --target "${{ matrix.target }}"

      - name: Free disk space for DMG creation
        run: |
          df -h /
          # The Rust build leaves multi-GB of intermediate artifacts in target/.
          # We only need the final .app bundle (in bundle/) to create the DMG.
          for dir in src-tauri/target/*/release src-tauri/target/release; do
            [ -d "$dir" ] || continue
            find "$dir" -mindepth 1 -maxdepth 1 ! -name bundle -exec rm -rf {} +
          done
          # Cargo registry/git caches are regeneratable and consume GBs.
          rm -rf ~/.cargo/registry ~/.cargo/git
          df -h /

      - name: Package DMG
        run: bun run package:macos-dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish draft prerelease
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## First Public Beta

          AI Conversations Explorer is a privacy-first desktop app that scans your local CLI coding-agent session archives and presents them in a single, searchable interface.

          ### Supported Providers

          - **Codex** — `~/.codex/sessions`
          - **Claude Code** — `~/.claude/sessions`
          - **Antigravity** — `~/.gemini/antigravity-cli/brain`
          - **Gemini CLI** — `~/.gemini/tmp`

          Custom directories can be added from Settings or onboarding.

          ### Features

          - **Full-text search** across messages, tool calls, terminal output, diffs, file previews, and errors (SQLite FTS5)
          - **Multi-provider unified view** with provider filters, date range, and errors-only toggle
          - **Full transcript viewer** with rendered Markdown, collapsible system events, structured metadata, timing, and token usage
          - **Tool call & diff viewer** with syntax-highlighted additions/removals
          - **Infinite scroll** through thousands of sessions
          - **Dark, light, and system-aware themes**
          - **Custom directory scanning** with content-hash-based incremental indexing

          ### Bug Fixes (since initial development)

          - Fixed React hooks error when transitioning from onboarding to the main explorer on first run
          - Fixed blurry text and icon rendering in the macOS Tauri webview (font smoothing)
          - Fixed blank conversation list when scrolling fast through large session counts

          ### Known Limitations

          - macOS only (Apple Silicon and Intel DMGs attached)
          - Diagnostics are manual only; issue reports include scan metadata, not conversation contents

          ### Privacy

          All processing is local. No telemetry, no cloud sync, no data leaves your machine.
          NOTES

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.dmg --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.dmg \
              --title "AI Conversations Explorer $RELEASE_TAG" \
              --notes-file release-notes.md \
              --draft \
              --prerelease
          fi
